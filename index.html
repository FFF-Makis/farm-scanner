<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#10201a">
<title>Farm Scanner</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --bg:#0e1713; --surface:#16221c; --surface2:#1e2e26; --border:#2c4136;
    --text:#eef5f0; --muted:#9db3a7; --accent:#5cc98a; --accent-dark:#2f7a52;
    --warn:#e0a339; --danger:#e05c4f; --focus:#7fd9a4;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-tap-highlight-color:transparent;
    display:flex; flex-direction:column;
  }
  h1,h2,h3{margin:0 0 8px;}
  button{font:inherit;}
  .app{display:flex; flex-direction:column; height:100%; min-height:100vh;}
  .topbar{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    padding:10px 14px; background:var(--surface); border-bottom:1px solid var(--border);
    position:sticky; top:env(safe-area-inset-top,0px); z-index:20;
  }
  .topbar .brand{font-weight:700; font-size:15px; display:flex; align-items:center; gap:8px;}
  .topbar .brand .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);}
  .pillrow{display:flex; gap:6px; flex-wrap:wrap;}
  .pill{
    background:var(--surface2); border:1px solid var(--border); color:var(--text);
    border-radius:999px; padding:6px 12px; font-size:12.5px; display:flex; align-items:center; gap:6px;
    white-space:nowrap;
  }
  .pill.accent{border-color:var(--accent-dark); color:var(--accent);}
  .pill button.x{
    background:none; border:none; color:var(--muted); font-size:14px; line-height:1; padding:0 0 0 2px; cursor:pointer;
  }
  main{flex:1; display:flex; flex-direction:column; min-height:0; position:relative;}
  .screen{display:flex; flex-direction:column; flex:1; min-height:0; padding:14px; gap:12px; overflow-y:auto;}
  .screen[hidden]{display:none!important;}

  /* Scan screen */
  #screen-scan{padding:0; gap:0;}
  .cam-wrap{position:relative; width:100%; aspect-ratio:3/4; background:#000; overflow:hidden; flex-shrink:0;}
  #video{width:100%; height:100%; object-fit:cover; display:block;}
  .cam-frame{
    position:absolute; inset:10% 14%; border:3px solid rgba(255,255,255,.55); border-radius:18px;
    box-shadow:0 0 0 999px rgba(0,0,0,.28);
    pointer-events:none;
  }
  .cam-hint{
    position:absolute; left:0; right:0; bottom:14px; text-align:center; color:#fff;
    font-size:13px; text-shadow:0 1px 3px rgba(0,0,0,.8); pointer-events:none;
  }
  .cam-error{padding:18px; text-align:center; color:var(--muted); font-size:14px;}
  .cam-error button{margin-top:10px;}

  .scan-controls{padding:14px; display:flex; flex-direction:column; gap:10px;}
  .memory-strip{display:flex; flex-wrap:wrap; gap:6px; max-height:96px; overflow-y:auto;}
  .memory-strip .pill{background:var(--surface); }

  /* Buttons */
  .btn{
    border:1px solid var(--border); background:var(--surface2); color:var(--text);
    padding:14px 16px; border-radius:12px; font-size:15.5px; font-weight:600; cursor:pointer;
    display:flex; align-items:center; justify-content:center; gap:8px; text-align:center;
  }
  .btn:active{transform:scale(0.98);}
  .btn.primary{background:var(--accent); border-color:var(--accent); color:#08170f;}
  .btn.secondary{background:transparent;}
  .btn.danger{background:transparent; border-color:var(--danger); color:var(--danger);}
  .btn.big{padding:18px; font-size:16.5px;}
  .btn[disabled]{opacity:.4; pointer-events:none;}
  .btn-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .btn-col{display:flex; flex-direction:column; gap:10px;}

  /* Modal (found-code prompt) */
  .modal-backdrop{
    position:absolute; inset:0; background:rgba(0,0,0,.55); display:flex; align-items:flex-end;
    z-index:30;
  }
  .modal-backdrop[hidden]{display:none!important;}
  .modal-card{
    width:100%; background:var(--surface); border-top-left-radius:18px; border-top-right-radius:18px;
    padding:18px; padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));
    border-top:1px solid var(--border);
    animation:slideup .18s ease-out;
  }
  @keyframes slideup{from{transform:translateY(24px); opacity:0;} to{transform:translateY(0); opacity:1;}}
  .code-kind{font-size:11.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin-bottom:4px;}
  .code-label{font-size:19px; font-weight:700; margin-bottom:2px; word-break:break-word;}
  .code-sub{font-size:13px; color:var(--muted); margin-bottom:14px;}

  /* Toast */
  .toast{
    position:fixed; left:50%; transform:translateX(-50%); bottom:calc(20px + env(safe-area-inset-bottom,0px));
    background:#0c1a13; color:#eef5f0; border:1px solid var(--accent-dark); padding:10px 16px; border-radius:999px;
    font-size:13.5px; z-index:50; max-width:88vw; text-align:center; box-shadow:0 6px 20px rgba(0,0,0,.4);
  }

  /* Forms */
  label{font-size:13px; color:var(--muted); display:block; margin-bottom:6px;}
  input[type=text], input[type=number], textarea, select{
    width:100%; background:var(--surface2); border:1px solid var(--border); color:var(--text);
    border-radius:10px; padding:12px; font-size:16px; margin-bottom:14px;
  }
  textarea{min-height:70px; resize:vertical;}
  .field{margin-bottom:2px;}
  .radio-row{display:flex; flex-direction:column; gap:8px; margin-bottom:14px;}
  .radio-opt{
    display:flex; align-items:center; gap:10px; border:1px solid var(--border); background:var(--surface2);
    padding:12px; border-radius:10px; cursor:pointer;
  }
  .radio-opt input{width:18px; height:18px; margin:0; flex-shrink:0;}
  .radio-opt.selected{border-color:var(--accent); background:rgba(92,201,138,.08);}
  .helper{font-size:12.5px; color:var(--muted); line-height:1.5;}

  .list-scroll{flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:8px;}
  .log-row{
    background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:10px 12px;
    font-size:13px; display:flex; flex-direction:column; gap:2px;
  }
  .log-row .top{display:flex; justify-content:space-between; gap:8px; font-weight:600;}
  .log-row .meta{color:var(--muted); font-size:12px;}
  .badge{font-size:10.5px; padding:2px 7px; border-radius:999px; border:1px solid var(--border);}
  .badge.sent{color:var(--accent); border-color:var(--accent-dark);}
  .badge.unsent{color:var(--warn); border-color:#5c4a1f;}

  .empty{color:var(--muted); font-size:14px; text-align:center; padding:30px 10px;}
  .footer-actions{padding:12px 14px; border-top:1px solid var(--border); background:var(--surface); display:flex; gap:10px;}
  .grow{flex:1;}
  a.linklike{color:var(--accent); text-decoration:underline;}
</style>
</head>
<body>
<div class="app">

  <div class="topbar">
    <div class="brand"><span class="dot"></span> Farm Scanner</div>
    <div class="pillrow">
      <button class="pill" id="btn-open-log" title="View log">📋 <span id="pending-count">0</span> to send</button>
    </div>
  </div>

  <main>

    <!-- SCAN SCREEN -->
    <section class="screen" id="screen-scan">
      <div class="cam-wrap">
        <video id="video" playsinline muted autoplay></video>
        <div class="cam-frame" id="cam-frame"></div>
        <div class="cam-hint" id="cam-hint">Point at a QR code</div>
        <div class="cam-error" id="cam-error" hidden>
          <div>Camera access is needed to scan codes.</div>
          <button class="btn primary" id="btn-retry-cam">Allow camera</button>
        </div>
      </div>
      <div class="scan-controls">
        <div class="memory-strip" id="memory-strip"></div>
        <button class="btn primary big" id="btn-act-on-memory" disabled>Act on 0 scanned codes</button>
      </div>
    </section>

    <!-- ACTION SELECT SCREEN -->
    <section class="screen" id="screen-action" hidden>
      <h2>Choose action</h2>
      <div class="helper" id="action-context"></div>
      <div class="memory-strip" id="action-memory-strip"></div>
      <div class="btn-col" id="action-buttons"></div>
      <button class="btn secondary" id="btn-back-to-scan">← Back to scanning</button>
    </section>

    <!-- DESTINATION SCAN (rack/room) -->
    <section class="screen" id="screen-dest-scan" hidden style="padding:0;">
      <div class="cam-wrap">
        <video id="video-dest" playsinline muted autoplay></video>
        <div class="cam-frame"></div>
        <div class="cam-hint" id="dest-hint">Scan destination code</div>
      </div>
      <div class="scan-controls">
        <button class="btn secondary" id="btn-cancel-dest">Cancel</button>
      </div>
    </section>

    <!-- DOWNSTREAM INPUT (harvest kg / retire reason / confirm) -->
    <section class="screen" id="screen-input" hidden>
      <h2 id="input-title">Details</h2>
      <div class="helper" id="input-context" style="margin-bottom:8px;"></div>
      <div id="input-body"></div>
      <div class="grow"></div>
      <div class="btn-col">
        <button class="btn primary big" id="btn-confirm-action">Confirm & log</button>
        <button class="btn secondary" id="btn-cancel-action">Cancel</button>
      </div>
    </section>

    <!-- LOG / EXPORT SCREEN -->
    <section class="screen" id="screen-log" hidden>
      <h2>Action log</h2>
      <div class="list-scroll" id="log-list"></div>
      <div class="btn-col">
        <button class="btn primary big" id="btn-send-log">Send unsent to laptop</button>
        <button class="btn secondary" id="btn-export-all">Export everything (CSV)</button>
        <button class="btn danger" id="btn-clear-sent">Clear sent entries</button>
        <button class="btn secondary" id="btn-close-log">← Back to scanning</button>
      </div>
    </section>

  </main>

  <!-- FOUND-CODE MODAL -->
  <div class="modal-backdrop" id="modal-found" hidden>
    <div class="modal-card">
      <div class="code-kind" id="found-kind">Code</div>
      <div class="code-label" id="found-label">—</div>
      <div class="code-sub" id="found-sub"></div>
      <div class="btn-grid">
        <button class="btn primary" id="btn-remember">Remember</button>
        <button class="btn secondary" id="btn-discard">Discard</button>
      </div>
      <div style="height:10px;"></div>
      <button class="btn secondary" id="btn-act-now" style="width:100%;">Act on codes in memory (<span id="found-mem-count">0</span>)</button>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script>
(function(){
  "use strict";

  // ---------------------------------------------------------------
  // Persistent state (localStorage) -- this is a real, user-owned
  // installed app, not a hosted preview, so localStorage is the
  // right place to keep unsent actions safe across app restarts.
  // ---------------------------------------------------------------
  var STORAGE_KEY = "farmScanner.v1";
  var state = loadState();

  function loadState(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(raw){
        var parsed = JSON.parse(raw);
        parsed.memory = parsed.memory || [];
        parsed.actions = parsed.actions || [];
        return parsed;
      }
    }catch(e){ /* ignore, start fresh */ }
    return { memory: [], actions: [] };
  }
  function saveState(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){ /* storage unavailable; continue in-memory */ }
  }

  // ---------------------------------------------------------------
  // QR code classification -- matches the workbook's own QR Code
  // Text formulas exactly:
  //   Rack:  "<RackID> | <RackID> | <RoomName>"        (3 segments on " | ")
  //   Room:  "<RoomID> | <RoomName>"                    (2 segments on " | ")
  //   Unit:  "<BatchID>-<UnitNum>|<Species>|<DDMMYYYY>" (bare "|", no spaces)
  // ---------------------------------------------------------------
  function classifyCode(raw){
    raw = (raw || "").trim();
    if(raw.indexOf(" | ") !== -1){
      var parts = raw.split(" | ");
      if(parts.length === 3){
        return { type:"rack", raw:raw, rackId:parts[0], roomName:parts[2],
                 label:"Rack " + parts[0], sub:"in " + parts[2] };
      }
      if(parts.length === 2){
        return { type:"room", raw:raw, roomId:parts[0], roomName:parts[1],
                 label:"Room " + parts[1], sub:parts[0] };
      }
      return { type:"unknown", raw:raw, label:"Unrecognized code" };
    }
    var bar = raw.split("|");
    if(bar.length === 3){
      var idPart = bar[0];
      var lastDash = idPart.lastIndexOf("-");
      if(lastDash > -1){
        var batchId = idPart.slice(0, lastDash);
        var unitNum = idPart.slice(lastDash + 1);
        var species = bar[1];
        var dateStr = bar[2];
        return { type:"unit", raw:raw, batchId:batchId, unitNum:unitNum, species:species, dateStr:dateStr,
                 label: batchId + " #" + unitNum, sub: species + " · made " + formatDDMMYYYY(dateStr) };
      }
    }
    return { type:"unknown", raw:raw, label:"Unrecognized code" };
  }

  function formatDDMMYYYY(s){
    if(!s || s.length !== 8) return s || "";
    return s.slice(0,2) + "/" + s.slice(2,4) + "/" + s.slice(4,8);
  }

  function codeKey(c){ return c.type + ":" + c.raw; }

  // ---------------------------------------------------------------
  // Actions definition: which memory contents each action needs,
  // and what downstream step it requires.
  // ---------------------------------------------------------------
  var ACTIONS = [
    { id:"HARVEST", title:"Record harvest", needs:"unit", downstream:"kg" },
    { id:"REMOVE_FROM_FRUITING", title:"Remove from fruiting", needs:"unit", downstream:"none" },
    { id:"MOVE_TO_RACK", title:"Move to another rack", needs:"unit", downstream:"scan-rack" },
    { id:"MOVE_RACK_TO_ROOM", title:"Move rack to another room", needs:"rack", downstream:"scan-room" },
    { id:"RETIRE", title:"Retire units / record reason", needs:"unit", downstream:"reason" }
  ];
  var RETIRE_REASONS = ["Contaminated","Damaged","Used Up","Discarded","Other"];

  function actionAvailability(action){
    if(state.memory.length === 0) return { ok:false, why:"No codes scanned yet" };
    var wrongType = state.memory.filter(function(c){ return c.type !== action.needs; });
    if(wrongType.length > 0){
      return { ok:false, why:"Only works with " + (action.needs === "unit" ? "unit (jar/bag)" : action.needs) + " codes -- remove the others first" };
    }
    return { ok:true };
  }

  // ---------------------------------------------------------------
  // Camera handling
  // ---------------------------------------------------------------
  var videoMain = document.getElementById("video");
  var videoDest = document.getElementById("video-dest");
  var scanCanvas = document.createElement("canvas");
  var scanCtx = scanCanvas.getContext("2d", { willReadFrequently:true });
  var mainStream = null;
  var scanLoopHandle = null;
  var scanMode = "main";       // "main" | "dest" | "off"
  var suppressedCode = "";     // a code already surfaced -- ignored until it leaves view
  var destExpectType = null;   // "rack" | "room"
  var destCallback = null;

  function startCamera(){
    document.getElementById("cam-error").hidden = true;
    navigator.mediaDevices.getUserMedia({ video:{ facingMode:{ ideal:"environment" } }, audio:false })
      .then(function(stream){
        mainStream = stream;
        videoMain.srcObject = stream;
        videoDest.srcObject = stream;
        scanMode = "main";
        runScanLoop();
      })
      .catch(function(err){
        document.getElementById("cam-error").hidden = false;
        console.log("[FarmScanner] camera error", err && err.name, err && err.message);
      });
  }

  function runScanLoop(){
    if(scanLoopHandle) cancelAnimationFrame(scanLoopHandle);
    function tick(){
      scanLoopHandle = requestAnimationFrame(tick);
      if(scanMode === "off") return;
      if(document.getElementById("modal-found").hidden === false) return; // paused while prompt is up

      var v = scanMode === "dest" ? videoDest : videoMain;
      if(!v || v.readyState !== v.HAVE_ENOUGH_DATA) return;

      var w = v.videoWidth, h = v.videoHeight;
      if(!w || !h) return;
      scanCanvas.width = w; scanCanvas.height = h;
      scanCtx.drawImage(v, 0, 0, w, h);
      var imageData;
      try{ imageData = scanCtx.getImageData(0, 0, w, h); }catch(e){ return; }

      var result = (typeof jsQR === "function") ? jsQR(imageData.data, w, h, { inversionAttempts:"dontInvert" }) : null;
      var raw = (result && result.data) ? result.data : "";

      if(raw === ""){
        // Nothing decoded this frame -- whatever was in view has moved out,
        // so it's fair game to trigger again if it comes back.
        suppressedCode = "";
        return;
      }
      if(raw === suppressedCode){
        // Same physical code still sitting in the frame (phone held steady
        // on a sticker) -- we've already surfaced it once; don't re-pop
        // the prompt every frame until it actually moves out of view.
        return;
      }
      handleDetected(raw);
    }
    tick();
  }

  function handleDetected(raw){
    suppressedCode = raw; // don't re-surface this exact code until it leaves the frame

    if(scanMode === "dest"){
      var parsed = classifyCode(raw);
      if(parsed.type !== destExpectType){
        showToast("That's a " + parsed.type + " code -- scan a " + destExpectType + " code instead");
        return;
      }
      var cb = destCallback;
      destCallback = null;
      cb(parsed);
      return;
    }
    // main scanning: pop the remember/discard/act prompt
    var parsed = classifyCode(raw);
    document.getElementById("found-kind").textContent = parsed.type === "unknown" ? "Unrecognized" : parsed.type;
    document.getElementById("found-label").textContent = parsed.label;
    document.getElementById("found-sub").textContent = parsed.sub || parsed.raw;
    document.getElementById("found-mem-count").textContent = state.memory.length;
    var modal = document.getElementById("modal-found");
    modal.hidden = false;
    modal.dataset.pending = JSON.stringify(parsed);
  }

  // ---------------------------------------------------------------
  // Modal button handlers
  // ---------------------------------------------------------------
  document.getElementById("btn-remember").addEventListener("click", function(){
    var parsed = JSON.parse(document.getElementById("modal-found").dataset.pending || "{}");
    if(parsed.type === "unknown"){
      showToast("Couldn't read that as a known code");
    } else {
      var key = codeKey(parsed);
      if(state.memory.some(function(c){ return codeKey(c) === key; })){
        showToast("Already have that one");
      } else {
        state.memory.push(parsed);
        saveState();
        showToast("Remembered " + parsed.label);
      }
    }
    closeModalAndResume();
  });
  document.getElementById("btn-discard").addEventListener("click", function(){
    closeModalAndResume();
  });
  document.getElementById("btn-act-now").addEventListener("click", function(){
    closeModalAndResume();
    if(state.memory.length === 0){
      showToast("Nothing in memory yet");
      return;
    }
    goToActionSelect();
  });
  function closeModalAndResume(){
    document.getElementById("modal-found").hidden = true;
    renderMemoryStrip();
  }

  document.getElementById("btn-retry-cam").addEventListener("click", startCamera);

  // ---------------------------------------------------------------
  // Memory strip rendering (both on scan screen and action screen)
  // ---------------------------------------------------------------
  function renderMemoryStrip(){
    var count = state.memory.length;
    document.getElementById("btn-act-on-memory").textContent = "Act on " + count + " scanned code" + (count===1?"":"s");
    document.getElementById("btn-act-on-memory").disabled = count === 0;
    fillStrip(document.getElementById("memory-strip"), true);
    fillStrip(document.getElementById("action-memory-strip"), true);
  }
  function fillStrip(el, removable){
    el.innerHTML = "";
    state.memory.forEach(function(c, idx){
      var pill = document.createElement("div");
      pill.className = "pill accent";
      pill.textContent = c.label;
      if(removable){
        var x = document.createElement("button");
        x.className = "x"; x.textContent = "✕";
        x.addEventListener("click", function(){
          state.memory.splice(idx, 1);
          saveState();
          renderMemoryStrip();
          if(state.memory.length === 0 && !document.getElementById("screen-scan").hidden === false){
            // stay on whichever screen we're on; action screen re-render handled by caller
          }
          if(!document.getElementById("screen-action").hidden){
            renderActionButtons();
          }
        });
        pill.appendChild(x);
      }
      el.appendChild(pill);
    });
  }

  document.getElementById("btn-act-on-memory").addEventListener("click", function(){
    if(state.memory.length === 0) return;
    goToActionSelect();
  });

  // ---------------------------------------------------------------
  // Screen navigation
  // ---------------------------------------------------------------
  var screens = ["screen-scan","screen-action","screen-dest-scan","screen-input","screen-log"];
  function showScreen(id){
    document.getElementById("modal-found").hidden = true; // never leave the prompt stranded over a different screen
    screens.forEach(function(s){ document.getElementById(s).hidden = (s !== id); });
    if(id === "screen-scan"){ scanMode = "main"; suppressedCode = ""; }
    else if(id === "screen-dest-scan"){ scanMode = "dest"; suppressedCode = ""; }
    else { scanMode = "off"; }
  }

  document.getElementById("btn-back-to-scan").addEventListener("click", function(){ showScreen("screen-scan"); });
  document.getElementById("btn-open-log").addEventListener("click", function(){ renderLog(); showScreen("screen-log"); });
  document.getElementById("btn-close-log").addEventListener("click", function(){ showScreen("screen-scan"); });

  function goToActionSelect(){
    document.getElementById("action-context").textContent =
      state.memory.length + " code" + (state.memory.length===1?"":"s") + " in memory: " +
      summarizeTypes(state.memory);
    renderMemoryStrip();
    renderActionButtons();
    showScreen("screen-action");
  }

  function summarizeTypes(list){
    var counts = {};
    list.forEach(function(c){ counts[c.type] = (counts[c.type]||0)+1; });
    return Object.keys(counts).map(function(k){ return counts[k] + " " + k; }).join(", ");
  }

  function renderActionButtons(){
    var box = document.getElementById("action-buttons");
    box.innerHTML = "";
    ACTIONS.forEach(function(action){
      var avail = actionAvailability(action);
      var btn = document.createElement("button");
      btn.className = "btn" + (avail.ok ? "" : " secondary");
      btn.disabled = !avail.ok;
      btn.innerHTML = action.title + (avail.ok ? "" : "<br><span class='helper'>" + avail.why + "</span>");
      btn.addEventListener("click", function(){ startAction(action); });
      box.appendChild(btn);
    });
  }

  // ---------------------------------------------------------------
  // Action flow: downstream steps
  // ---------------------------------------------------------------
  var currentAction = null;
  var currentDestination = null; // {type, rackId/roomId, roomName...}
  var currentExtra = {};         // {kg, reason, notes}

  function startAction(action){
    currentAction = action;
    currentDestination = null;
    currentExtra = {};
    if(action.downstream === "none"){
      showInputScreen(action, null);
    } else if(action.downstream === "kg"){
      showInputScreen(action, null);
    } else if(action.downstream === "reason"){
      showInputScreen(action, null);
    } else if(action.downstream === "scan-rack"){
      openDestScan("rack", function(dest){ currentDestination = dest; showInputScreen(action, dest); });
    } else if(action.downstream === "scan-room"){
      openDestScan("room", function(dest){ currentDestination = dest; showInputScreen(action, dest); });
    }
  }

  function openDestScan(expectType, cb){
    destExpectType = expectType;
    destCallback = cb;
    document.getElementById("dest-hint").textContent =
      "Scan destination " + (expectType === "rack" ? "rack" : "room") + " QR code";
    showScreen("screen-dest-scan");
  }
  document.getElementById("btn-cancel-dest").addEventListener("click", function(){
    destCallback = null;
    showScreen("screen-action");
  });

  function showInputScreen(action, dest){
    document.getElementById("input-title").textContent = action.title;
    var ctx = state.memory.length + " code" + (state.memory.length===1?"":"s") + ": " + summarizeTypes(state.memory);
    if(dest) ctx += "  →  " + dest.label;
    document.getElementById("input-context").textContent = ctx;

    var body = document.getElementById("input-body");
    body.innerHTML = "";

    if(action.downstream === "kg"){
      body.innerHTML =
        '<div class="field"><label for="inp-kg">Kg harvested (combined total)</label>' +
        '<input type="number" id="inp-kg" inputmode="decimal" step="0.01" min="0" placeholder="e.g. 4.2"></div>' +
        '<div class="field"><label for="inp-notes">Notes (optional)</label>' +
        '<textarea id="inp-notes" placeholder="Anything worth noting"></textarea></div>';
    } else if(action.downstream === "reason"){
      var rows = RETIRE_REASONS.map(function(r, i){
        return '<label class="radio-opt" data-val="' + r + '">' +
          '<input type="radio" name="retire-reason" value="' + r + '"' + (i===0?' checked':'') + '> ' + r + '</label>';
      }).join("");
      body.innerHTML =
        '<div class="radio-row" id="retire-reason-row">' + rows + '</div>' +
        '<div class="field" id="other-reason-field" hidden><label for="inp-other-reason">Describe reason</label>' +
        '<input type="text" id="inp-other-reason" placeholder="Reason"></div>' +
        '<div class="field"><label for="inp-notes">Notes (optional)</label>' +
        '<textarea id="inp-notes" placeholder="Anything worth noting"></textarea></div>';
      var radios = body.querySelectorAll('input[name="retire-reason"]');
      function syncOther(){
        var val = body.querySelector('input[name="retire-reason"]:checked').value;
        document.getElementById("other-reason-field").hidden = (val !== "Other");
        body.querySelectorAll(".radio-opt").forEach(function(el){
          el.classList.toggle("selected", el.dataset.val === val);
        });
      }
      radios.forEach(function(r){ r.addEventListener("change", syncOther); });
      syncOther();
    } else if(action.downstream === "none"){
      body.innerHTML =
        '<div class="helper" style="margin-bottom:14px;">No extra details needed -- confirm to log this action.</div>' +
        '<div class="field"><label for="inp-notes">Notes (optional)</label>' +
        '<textarea id="inp-notes" placeholder="Anything worth noting"></textarea></div>';
    } else {
      // scan-rack / scan-room already collected the destination; just confirm + notes
      body.innerHTML =
        '<div class="field"><label for="inp-notes">Notes (optional)</label>' +
        '<textarea id="inp-notes" placeholder="Anything worth noting"></textarea></div>';
    }
    showScreen("screen-input");
  }

  document.getElementById("btn-cancel-action").addEventListener("click", function(){
    currentAction = null; currentDestination = null;
    showScreen("screen-action");
  });

  document.getElementById("btn-confirm-action").addEventListener("click", function(){
    if(!currentAction) return;
    var notesEl = document.getElementById("inp-notes");
    var notes = notesEl ? notesEl.value.trim() : "";
    var value = "", reason = "", destination = "";

    if(currentAction.downstream === "kg"){
      var kgEl = document.getElementById("inp-kg");
      var kg = parseFloat(kgEl.value);
      if(isNaN(kg) || kg < 0){ showToast("Enter a valid kg amount"); return; }
      value = String(kg);
    }
    if(currentAction.downstream === "reason"){
      var sel = document.querySelector('input[name="retire-reason"]:checked');
      reason = sel ? sel.value : "";
      if(reason === "Other"){
        var otherEl = document.getElementById("inp-other-reason");
        var other = otherEl.value.trim();
        if(!other){ showToast("Describe the reason"); return; }
        reason = other;
      }
    }
    if(currentDestination){
      destination = currentDestination.type === "rack" ? currentDestination.rackId : currentDestination.roomId;
    }

    var entry = {
      id: "A" + Date.now() + "-" + Math.floor(Math.random()*1000),
      timestamp: new Date().toISOString(),
      action: currentAction.id,
      codes: state.memory.map(function(c){
        return c.type === "unit" ? (c.batchId + "|" + c.unitNum) : (c.type === "rack" ? c.rackId : c.roomId);
      }).join(";"),
      codeLabels: state.memory.map(function(c){ return c.label; }).join(", "),
      destination: destination,
      value: value,
      reason: reason,
      notes: notes,
      sent: false
    };
    state.actions.unshift(entry);
    state.memory = [];
    saveState();
    showToast("Logged: " + currentAction.title);
    currentAction = null; currentDestination = null;
    renderMemoryStrip();
    updatePendingCount();
    showScreen("screen-scan");
  });

  // ---------------------------------------------------------------
  // Log / export screen
  // ---------------------------------------------------------------
  function updatePendingCount(){
    var n = state.actions.filter(function(a){ return !a.sent; }).length;
    document.getElementById("pending-count").textContent = n;
  }

  function renderLog(){
    var list = document.getElementById("log-list");
    list.innerHTML = "";
    if(state.actions.length === 0){
      list.innerHTML = '<div class="empty">No actions logged yet. Scan some codes to get started.</div>';
      return;
    }
    state.actions.forEach(function(a){
      var row = document.createElement("div");
      row.className = "log-row";
      var d = new Date(a.timestamp);
      row.innerHTML =
        '<div class="top"><span>' + actionTitle(a.action) + '</span>' +
        '<span class="badge ' + (a.sent?'sent':'unsent') + '">' + (a.sent?'sent':'not sent') + '</span></div>' +
        '<div class="meta">' + d.toLocaleString() + '</div>' +
        '<div>' + escapeHtml(a.codeLabels) + '</div>' +
        (a.destination ? '<div class="meta">→ ' + escapeHtml(a.destination) + '</div>' : '') +
        (a.value ? '<div class="meta">' + escapeHtml(a.value) + ' kg</div>' : '') +
        (a.reason ? '<div class="meta">Reason: ' + escapeHtml(a.reason) + '</div>' : '') +
        (a.notes ? '<div class="meta">Note: ' + escapeHtml(a.notes) + '</div>' : '');
      list.appendChild(row);
    });
  }
  function actionTitle(id){
    var m = ACTIONS.filter(function(a){ return a.id === id; })[0];
    return m ? m.title : id;
  }
  function escapeHtml(s){
    return String(s||"").replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  // ---------------------------------------------------------------
  // CSV export + sync
  // ---------------------------------------------------------------
  var CSV_HEADER = ["timestamp","action","codes","destination","value","reason","notes"];
  function buildCsv(rows){
    var lines = [CSV_HEADER.join(",")];
    rows.forEach(function(a){
      lines.push(CSV_HEADER.map(function(k){ return csvEscape(a[k] || ""); }).join(","));
    });
    return lines.join("\r\n");
  }
  function csvEscape(v){
    v = String(v);
    if(/[",\r\n]/.test(v)) return '"' + v.replace(/"/g, '""') + '"';
    return v;
  }

  function doExport(rows, markSent){
    if(rows.length === 0){ showToast("Nothing to send"); return; }
    var csv = buildCsv(rows);
    var filename = "farm-actions-" + new Date().toISOString().replace(/[:.]/g,"-") + ".csv";
    var blob = new Blob([csv], { type:"text/csv" });
    var file = new File([blob], filename, { type:"text/csv" });

    function fallbackDownload(){
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
      afterExport(rows, markSent, "Downloaded " + filename);
    }

    if(navigator.canShare && navigator.canShare({ files:[file] })){
      navigator.share({ files:[file], title:"Farm actions", text: rows.length + " action(s) for the mushroom farm sheet" })
        .then(function(){ afterExport(rows, markSent, "Shared " + filename); })
        .catch(function(err){
          if(err && err.name === "AbortError") return; // user cancelled the share sheet
          fallbackDownload();
        });
    } else {
      fallbackDownload();
    }
  }
  function afterExport(rows, markSent, msg){
    if(markSent){
      var ids = rows.map(function(r){ return r.id; });
      state.actions.forEach(function(a){ if(ids.indexOf(a.id) !== -1) a.sent = true; });
      saveState();
      updatePendingCount();
      renderLog();
    }
    showToast(msg);
  }

  document.getElementById("btn-send-log").addEventListener("click", function(){
    var unsent = state.actions.filter(function(a){ return !a.sent; });
    doExport(unsent, true);
  });
  document.getElementById("btn-export-all").addEventListener("click", function(){
    doExport(state.actions.slice(), false);
  });
  document.getElementById("btn-clear-sent").addEventListener("click", function(){
    var before = state.actions.length;
    state.actions = state.actions.filter(function(a){ return !a.sent; });
    saveState();
    renderLog();
    showToast((before - state.actions.length) + " sent entries cleared");
  });

  // ---------------------------------------------------------------
  // Toast helper
  // ---------------------------------------------------------------
  var toastTimer = null;
  function showToast(msg){
    var existing = document.querySelector(".toast");
    if(existing) existing.remove();
    var t = document.createElement("div");
    t.className = "toast";
    t.textContent = msg;
    document.body.appendChild(t);
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ t.remove(); }, 2200);
  }

  // ---------------------------------------------------------------
  // Init
  // ---------------------------------------------------------------
  renderMemoryStrip();
  updatePendingCount();
  startCamera();

  if("serviceWorker" in navigator){
    navigator.serviceWorker.register("sw.js").catch(function(){ /* offline install still works without it */ });
  }
})();
</script>
</body>
